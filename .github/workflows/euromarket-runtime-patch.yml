name: EuroMarket runtime patch

on:
  push:
    branches: [euromarket-deploy]
    paths:
      - 'euromarket/runtime-patch/trigger.txt'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: euromarket-deploy
          fetch-depth: 0
      - name: Append verified runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root = Path('euromarket')
          patch = (root/'runtime-patch/part1.txt').read_text() + (root/'runtime-patch/part2.txt').read_text()
          digest = hashlib.sha256(patch.encode()).hexdigest()
          marker = root/'runtime-patch/applied.txt'
          if marker.exists() and marker.read_text().strip() == digest:
              print('Patch already applied')
              raise SystemExit(0)
          encoded = base64.b64encode(gzip.compress(patch.encode(), compresslevel=9, mtime=0)).decode()
          target = root/'r4.txt'
          target.write_text(target.read_text().strip() + encoded)
          marker.write_text(digest + '\n')
          print('Appended patch', digest, 'encoded bytes', len(encoded))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'EuroMarket Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add euromarket/r4.txt euromarket/runtime-patch/applied.txt
          git commit -m 'Apply EuroMarket chat and mobile menu patch [skip ci]'
          git push origin HEAD:euromarket-deploy
