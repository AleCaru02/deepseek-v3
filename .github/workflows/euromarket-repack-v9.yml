name: Repack EuroMarket bundle v9

on:
  push:
    branches:
      - euromarket-deploy
    paths:
      - euromarket/repack-v9.txt

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: euromarket-deploy
          fetch-depth: 0

      - name: Consolidate all gzip/base64 members into one valid bundle
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, re

          root = Path('euromarket')
          raw = ''.join((root / f'r{i}.txt').read_text(encoding='utf-8') for i in range(5))
          raw = ''.join(raw.split())

          # Earlier patches were appended as separate padded base64 gzip members.
          # Split only where padding is followed by the next member.
          pieces = []
          start = 0
          for match in re.finditer(r'={1,2}(?=[A-Za-z0-9+/])', raw):
              end = match.end()
              pieces.append(raw[start:end])
              start = end
          pieces.append(raw[start:])
          pieces = [p for p in pieces if p]

          html_parts = []
          for index, piece in enumerate(pieces):
              try:
                  compressed = base64.b64decode(piece, validate=True)
                  html_parts.append(gzip.decompress(compressed).decode('utf-8'))
              except Exception as exc:
                  raise RuntimeError(f'Invalid bundle member {index}: {exc}') from exc

          html = ''.join(html_parts)
          if 'EuroMarket' not in html or '<html' not in html.lower():
              raise RuntimeError('Reconstructed document is not a valid EuroMarket page')

          packed = base64.b64encode(gzip.compress(html.encode('utf-8'), compresslevel=9, mtime=0)).decode('ascii')
          size = (len(packed) + 4) // 5
          chunks = [packed[i * size:(i + 1) * size] for i in range(4)]
          chunks.append(packed[4 * size:])

          for i, chunk in enumerate(chunks):
              (root / f'r{i}.txt').write_text(chunk, encoding='utf-8')

          (root / '.repack-v9-applied').write_text(
              f'members={len(pieces)} html_bytes={len(html.encode("utf-8"))} base64_chars={len(packed)}\n',
              encoding='utf-8',
          )

      - name: Commit repaired bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EuroMarket Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add euromarket/r0.txt euromarket/r1.txt euromarket/r2.txt euromarket/r3.txt euromarket/r4.txt euromarket/.repack-v9-applied
          git commit -m "Repack EuroMarket into one valid application bundle"
          git push origin HEAD:euromarket-deploy
